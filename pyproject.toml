[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-link-prediction"
version = "0.1.0"
description = "Comparison of graph link prediction methods on shared evaluation splits."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "networkx>=3.4,<4",
    "numpy>=1.26,<2",
    "scipy>=1.11,<2",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
embeddings = ["node2vec>=0.5,<1", "gensim>=4.4,<5"]
gnn = ["torch>=2.6,<3", "torch-geometric>=2.6,<3"]
dev = ["nbconvert>=7,<8", "ipykernel>=6,<8", "ruff>=0.11,<1"]
benchmark = ["psutil>=7,<8"]

[project.scripts]
link-prediction = "link_prediction:main"

[tool.setuptools]
py-modules = ["link_prediction"]

[tool.setuptools.packages.find]
include = ["linkpred*"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
