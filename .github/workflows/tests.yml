name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,embeddings,gnn]"
      - run: python -m ruff check link_prediction.py linkpred tests
      - run: python -m unittest discover -s tests -v
      - run: python link_prediction.py --dry-run --methods all
      - run: python -m nbconvert --execute --to notebook --output-dir reports link-prediction.ipynb
